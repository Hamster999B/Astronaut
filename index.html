<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Astronaut Clan | SkyCave</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(ellipse at 30% 40%, #0a142f, #030618);
            color: #eef2ff;
            min-height: 100vh;
            line-height: 1.5;
        }

        /* анимированные звёзды (лёгкий декор) */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle 3s infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8);}
            100% { opacity: 0.9; transform: scale(1.2);}
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
            position: relative;
            z-index: 2;
        }

        /* сине-голубой градиент для заголовков и акцентов */
        .gradient-text {
            background: linear-gradient(135deg, #3b82f6, #06b6d4, #38bdf8);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        /* Шапка клана */
        .clan-header {
            text-align: center;
            margin-bottom: 4rem;
        }
        .clan-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(14, 165, 233, 0.1);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 60px;
            padding: 0.4rem 1.2rem;
            margin-bottom: 1.2rem;
        }
        .clan-badge i {
            color: #38bdf8;
            font-size: 1rem;
        }
        .clan-badge span {
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #7abfff;
        }
        h1 {
            font-size: 5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa, #2dd4bf, #3b82f6);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }
        .tagline {
            font-size: 1.1rem;
            color: #9ab3e0;
            border-bottom: 1px dashed #2d3a6e;
            display: inline-block;
            padding-bottom: 0.5rem;
        }

        /* Карточка сервера (без мониторинга) */
        .server-card {
            background: rgba(12, 20, 40, 0.65);
            backdrop-filter: blur(14px);
            border-radius: 2.5rem;
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 2rem 2rem;
            margin-bottom: 3rem;
            text-align: center;
            box-shadow: 0 20px 30px -12px rgba(0,0,0,0.4);
        }
        .server-label {
            font-size: 1rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #a0c4ff;
            margin-bottom: 0.75rem;
        }
        .server-ip {
            font-size: 3.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6, #2dd4bf);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            word-break: break-all;
            font-family: monospace;
            letter-spacing: 2px;
        }
        .copy-btn {
            background: none;
            border: 1px solid #2dd4bf;
            color: #2dd4bf;
            border-radius: 32px;
            padding: 0.4rem 1.2rem;
            margin-top: 1rem;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .copy-btn:hover {
            background: #2dd4bf20;
        }

        /* Сетка основатель + модераторы */
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            margin: 2rem 0;
        }
        @media (max-width: 720px) {
            .grid-2 { grid-template-columns: 1fr; }
            h1 { font-size: 3rem; }
            .server-ip { font-size: 1.8rem; }
        }
        .info-card {
            background: rgba(8, 14, 30, 0.65);
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 1.8rem;
            border: 1px solid #1f2b4e;
            transition: 0.2s;
        }
        .info-card:hover {
            border-color: #38bdf8;
        }
        .card-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            border-left: 4px solid #2dd4bf;
            padding-left: 1rem;
        }
        .card-title i {
            color: #2dd4bf;
        }
        .founder {
            background: linear-gradient(95deg, #07122b, #0a1532);
            border-radius: 1.5rem;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .moderator-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .moderator-item {
            background: #0a1022;
            border-radius: 1.2rem;
            padding: 0.8rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            border: 1px solid #1f2b4e;
        }
        .moderator-item i {
            font-size: 1.8rem;
            color: #64b5f6;
        }
        .moderator-info strong {
            font-size: 1.1rem;
        }
        .moderator-info span {
            font-size: 0.7rem;
            color: #8aa2d4;
        }

        .footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid #1e2b4a;
            font-size: 0.75rem;
            color: #5b719b;
        }
    </style>
</head>
<body>
<div class="stars" id="starsContainer"></div>
<div class="container">
    <div class="clan-header">
        <div class="clan-badge">
            <i class="fas fa-satellite-dish"></i>
            <span>✦ космический клан ✦</span>
        </div>
        <h1>✦ ASTRONAUT ✦</h1>
        <div class="tagline">твой дом на SkyCave</div>
    </div>

    <!-- Блок сервера без мониторинга, с маленькой подписью и большим IP -->
    <div class="server-card">
        <div class="server-label">★ Играем на сервере ★</div>
        <div class="server-ip" id="serverIp">mc.skycave.pro:25565</div>
        <button class="copy-btn" onclick="copyIP()"><i class="far fa-copy"></i> Копировать адрес</button>
    </div>

    <div class="grid-2">
        <!-- Основатель -->
        <div class="info-card">
            <div class="card-title">
                <i class="fas fa-crown"></i>
                <span>Создатель клана</span>
            </div>
            <div class="founder">
                <i class="fas fa-user-astronaut" style="font-size: 2rem; color: #3b82f6;"></i>
                <div>
                    <strong style="font-size: 1.3rem;">UntitledAstro</strong><br>
                    <span style="color: #a0c4ff;">лидер и основатель Astronaut</span>
                </div>
            </div>
        </div>

        <!-- Модераторы (обновлённые ники) -->
        <div class="info-card">
            <div class="card-title">
                <i class="fas fa-shield-haltered"></i>
                <span>Модераторы клана</span>
            </div>
            <div class="moderator-list">
                <div class="moderator-item">
                    <i class="fas fa-user-shield"></i>
                    <div class="moderator-info">
                        <strong>XAXAXAXA00026</strong>
                        <span>модератор клана</span>
                    </div>
                </div>
                <div class="moderator-item">
                    <i class="fas fa-user-shield"></i>
                    <div class="moderator-info">
                        <strong>CEP132023</strong>
                        <span>модератор клана</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <i class="fas fa-globe"></i> SkyCave — лучший сервер • Astronaut ждёт тебя
    </div>
</div>

<script>
    // Генерация звёздного фона (декоративно)
    const starsContainer = document.getElementById('starsContainer');
    for (let i = 0; i < 180; i++) {
        let star = document.createElement('div');
        star.classList.add('star');
        let size = Math.random() * 2.5 + 1;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        star.style.top = `${Math.random() * 100}%`;
        star.style.left = `${Math.random() * 100}%`;
        star.style.animationDelay = `${Math.random() * 4}s`;
        star.style.animationDuration = `${Math.random() * 3 + 2}s`;
        starsContainer.appendChild(star);
    }

    // копирование IP
    window.copyIP = function() {
        const ipText = document.getElementById('serverIp').innerText;
        navigator.clipboard.writeText(ipText);
        const btn = document.querySelector('.copy-btn');
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-check"></i> Скопировано!';
        setTimeout(() => btn.innerHTML = originalHtml, 1500);
    };
</script>
</body>
</html>
